<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vídeo controlado pelo Scroll</title>

    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body{
            background: #000;
            overflow-x: hidden;
        }

        /* Vídeo ocupa toda a tela */
        #video{
            position: fixed;
            inset: 0;

            width: 100%;
            height: 100%;

            object-fit: cover;

            z-index: -1;
        }

        /* Área para gerar o scroll */
        .hero{
            height: 500vh;
            width: 100%;
        }

        .info{
            position: fixed;
            top: 30px;
            left: 30px;

            color: white;
            font-family: Arial, Helvetica, sans-serif;
            font-size: 20px;

            z-index: 10;
        }
    </style>
</head>

<body>

    <div class="info">
        Role a página ↓
    </div>

    <video id="video" muted playsinline preload="auto">
        <source src="Para Relaxar e se Conectar com a Natureza - Nossas Lindas Paisagens [ZvcTVGNeDj4].webm" type="video/webm">
        Seu navegador não suporta vídeos.
    </video>

    <section class="hero"></section>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3/dist/gsap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3/dist/ScrollTrigger.min.js"></script>

    <script>

        gsap.registerPlugin(ScrollTrigger);

        const video = document.getElementById("video");

        video.pause();

        video.addEventListener("loadedmetadata", () => {

            ScrollTrigger.create({

                trigger: ".hero",

                start: "top top",

                end: "bottom bottom",

                scrub: true,

                onUpdate(self){

                    video.currentTime = self.progress * video.duration;

                }

            });

        });

    </script>

</body>

</html>
