<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        height: 100vh;
        width: 100%;
        display: flex;
        justify-content: center;
        gap: 20px;
        align-items: center;
      }
      .form {
        background-color: rgb(24, 24, 24);
        display: flex;
        flex-direction: column;
        height: 30rem;
        padding: 10px;
        width: 20rem;
        border-radius: 20px;
      }
      .form input {
        margin-bottom: 10px;
        padding: 10px 20px;
        border-radius: 10px;
        border: none;
        color: black;
      }
      .form .button {
        padding: 10px;
        width: 10rem;
        margin: 10px auto;
        background-color: blue;
        border: none;
        color: #fff;
        border-radius: 10px;
        cursor: pointer;
      }
      .lista {
        margin-top: 20px;
        padding: 10px 20px;
      }
      .list {
        background-color: rgba(0, 47, 255, 0.13);
        padding: 5px 10px;
        color: #fff;
        border-radius: 10px;
        font-family: Arial, Helvetica, sans-serif;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
      .concluido {
        padding: 5px 10px;
        cursor: pointer;
        background-color: red;
        color: #fff;
        border: none;
        border-radius: 5px;
      }
      .feitos {
        background-color: black;
        height: 30rem;
        width: 20rem;
        border-radius: 20px;
        padding: 20px 30px;
        position: relative;
      }
      .feitos h1 {
        color: #fff;
        font-family: Arial, Helvetica, sans-serif;
      }
      .feitos button {
        padding: 10px 20px;
        background-color: blue;
        border: none;
        border-radius: 10px;
        color: #fff;
        position: absolute;
        bottom: 10px;
        right: 10px;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <form class="form">
      <input type="text" id="name" placeholder="Digite um titulo" required />
      <input
        type="text"
        id="descript"
        placeholder="Digite uma descrição"
        required
      />
      <button type="submit" class="button">Adicionar</button>

      <div class="lista"></div>
    </form>
    <div class="feitos">
      <h1>Concluidos</h1>
      <div class="tarefas-prontas">
        <div class="prontos"></div>
      </div>
      <button class="limpar">Limpar</button>
    </div>

    <script src="script.js"></script>
  </body>
</html>
