<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <link
      href="https://cdn.jsdelivr.net/npm/remixicon@4.9.0/fonts/remixicon.css"
      rel="stylesheet"
    />
    <title>Lista De Tarefas</title>
  </head>
  <body>
    <main>
      <aside>
        <div class="logo">
          <i class="ri-check-line"></i>
          <h4>Meu<span>Dia</span></h4>
        </div>
        <nav class="asidebar">
          <button data-categoria="Tarefas">
            <i class="ri-file-list-3-line"></i> Tarefas
          </button>
          <button data-categoria="Hoje">
            <i class="ri-calendar-todo-line"></i> Hoje
          </button>
          <button data-categoria="Planejamento">
            <i class="ri-calendar-todo-fill"></i> Planejamento
          </button>
          <button data-categoria="Concluidas">
            <i class="ri-check-line"></i> Concluidas
          </button>
        </nav>
        <hr />
        <div class="categorias">
          <div class="header">
            <p>CATEGORIAS</p>
            <i class="ri-add-line"></i>
          </div>
          <div class="list-categoria">
            <div class="categoria-skin">
              <span class="Trabalho"></span>
              <p>Trabalho</p>
            </div>
            <div class="categoria-skin">
              <span class="Estudos"></span>
              <p>Estudos</p>
            </div>
            <div class="categoria-skin">
              <span class="Pessoal"></span>
              <p>Pessoal</p>
            </div>
            <div class="categoria-skin">
              <span class="Saude"></span>
              <p>Saúde</p>
            </div>
          </div>
        </div>
      </aside>
      <section class="secao-principal">
        <header class="header-secao">
          <div class="info-header">
            <h3>Boa <span>Tarde</span>!</h3>
            <p>Organize suas tarefas e construa o seu progresso.</p>
          </div>

          <div class="form">
            <input type="text" placeholder="Buscar tarefas..." />
            <button class="formbtn" id="novatarefa">
              <i class="ri-add-line"></i>
              Nova tarefa
            </button>
          </div>
        </header>
        <div class="lista-cards">
          <div class="card">
            <i class="ri-file-list-2-line"></i>
            <div class="info">
              <p>Pendentes</p>
              <span class="pendentes"></span>
            </div>
          </div>
          <div class="card">
            <i class="ri-todo-line"></i>
            <div class="info">
              <p>Para Hoje</p>
              <span class="hoje"></span>
            </div>
          </div>
          <div class="card">
            <i class="ri-checkbox-circle-line"></i>
            <div class="info">
              <p>Concluidas</p>
              <span class="hoje"></span>
            </div>
          </div>
        </div>
        <article class="secoes">
          <article class="todos-secao">
            <div class="secao-fazer">
              <div class="list-fazer"></div>
            </div>
          </article>
          <article class="Proximas-secao">
            <div class="secao-concluida">
              <div class="list-concluido"></div>
            </div>
          </article>
        </article>
      </section>

      <article class="modal">
        <header>
          <div class="info">
            <h3>Nova Tarefa</h3>
            <p>Organize seu proximo passo</p>
          </div>
          <i class="ri-close-line fechar"></i>
        </header>

        <form>
          <div class="input-box">
            <label for="ititulo">Titulo</label>
            <input
              type="text"
              placeholder="Ex.: Finalizar portfólio"
              id="ititulo"
            />
          </div>
          <div class="input-box">
            <label for="descricao">Descrição</label>
            <textarea
              name="Descrição"
              id="descricao"
              placeholder="Adicione mais detalhes sobre a tarefa"
            ></textarea>
          </div>
          <div class="input-prioriade">
            <div class="prioridade">
              <label for="prioridade">Prioridade</label>
              <div class="escolha">
                <button type="button" class="baixa"><span></span>Baixa</button>
                <button type="button" class="media"><span></span>Média</button>
                <button type="button" class="alta"><span></span>Alta</button>
              </div>
            </div>
            <div class="entrega">
              <label for="data">Data de entrega</label>
              <div class="campo-data">
                <i class="ri-calendar-line"></i>
                <input type="date" name="data" id="data" />
                <span class="texto-data">Selecione uma data</span>
              </div>
            </div>
          </div>
          <div class="categoria-modal">
            <label for="categoria">Categoria</label>
            <select name="" id="opcao">
              <option value=""></option>
              <option value="Estudos">Estudos</option>
              <option value="Trabalho">Trabalho</option>
              <option value="Saude">Saúde</option>
              <option value="Pessoal">Pessoal</option>
            </select>
          </div>
          <div class="btn-modal">
            <button type="button" class="cancelar">Cancelar</button>
            <button type="submit"><i class="ri-add-line"></i> Criar tarefa</button>
          </div>
        </form>
      </article>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15/dist/gsap.min.js"></script>
    <script src="script.js"></script>
  </body>
</html>
